# M2 synthetic "filmed session" for the team-footage harness (stopwatch + staged events) on synth_aisle.
# Same staging as block_eval, plus tracker-like ID breaks (1.5 per person-minute) so per-ID timers undercount.
hz: 5
slot_s: 90
n_block: 22
n_browse: 22
stay_s: [20, 60]
lane_y: [2.5, 4.5]
walkway: Main walkway
passers: {rate_per_s: 0.1, speed_mps: [1.0, 1.5]}
block_passers: [3, 6]
block_lingerers: [2, 3]
browse_lingerers: [2, 3]   # v2: browse group size matched to block (v1 used 1-3, result kept in synth_block.json)
min_visit_s: 2.0
id_breaks_per_min: 1.5
