# synthetic generator scenario: passers, shelf lingerers (BROWSE) and walkway blockers (BLOCK)
seed: 0
duration_s: 600
hz: 5
passers:
  rate_per_s: 0.15
  speed_mps: [1.0, 1.5]
  lane_y: [2.5, 4.5]
lingerers:
  - {zone: Snacks, rate_per_s: 0.02, stay_s: [20, 90]}
  - {zone: Drinks, rate_per_s: 0.03, stay_s: [30, 120]}
  - {zone: Dairy, rate_per_s: 0.01, stay_s: [10, 40]}
blockers:   # small groups that stop to chat in the walkway; the first one starts 40 s in so the demo shows a BLOCK early
  - {zone: Main walkway, first_s: 40, rate_per_s: 0.004, stay_s: [30, 70], group: [2, 3]}
