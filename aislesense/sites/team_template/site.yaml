# Copy this folder to sites/team/ and fill it in (see docs/footage_dropin.md).
id: team_template
name: Team footage (template)
kind: video
label: Team footage (staged store aisle)
floor: {x0: 0.0, y0: 0.0, width: 10.0, height: 6.0, cell: 1.0}
fps: 30
stride: 2
loop: false
cameras:
  - id: phone1
    # file path, or phone URL such as http://PHONE_IP:8080/video or rtsp://PHONE_IP:8554/live
    source: http://PHONE_IP:8080/video
    # 4 image pixels (u, v) of 4 floor marks, and the same marks in metres on the floor plan
    image_points: [[100, 700], [1180, 700], [1000, 250], [280, 250]]
    floor_points: [[0, 0], [6, 0], [6, 6], [0, 6]]
